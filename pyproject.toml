[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skoob-uploader"
version = "0.1.0"
description = "Marca livros de uma lista PDF como lidos no Skoob."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Skoob Uploader contributors" }]
requires-python = ">=3.10"
dependencies = ["playwright>=1.50,<2", "pypdf>=5,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
skoob-uploader = "skoob_uploader.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
